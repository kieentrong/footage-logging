<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chấm cảnh — Footage Logging</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Bàn log: lưới thẻ cảnh, mỗi thẻ = ảnh 4 khung + 5 ô chấm; thanh tiến độ dính trên cùng */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1d2224; --mute:#6b7375; --line:#dde1df;
  --tally:#d6402f; --ok:#2f8f5b; --chip:#eceeec;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151819;--panel:#1e2324;--ink:#e7eae9;--mute:#9aa3a4;--line:#2e3436;--tally:#ff6b57;--ok:#56c38a;--chip:#272d2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151819;--panel:#1e2324;--ink:#e7eae9;--mute:#9aa3a4;--line:#2e3436;--tally:#ff6b57;--ok:#56c38a;--chip:#272d2e;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:end}
h1{font:700 30px/1 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
h1 .rec{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--tally);margin-right:10px;vertical-align:3px}
.meta{color:var(--mute);font-size:13px;max-width:62ch;margin:0}
.prog{margin-left:auto;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.bar{width:140px;height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.status{font-size:12px;color:var(--mute);width:100%}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.done{border-color:var(--ok)}
.shot{position:relative;background:#000}
.shot img{display:block;width:100%;height:auto}
.tc{position:absolute;left:8px;top:8px;font:500 12px var(--f-mono);background:rgba(0,0,0,.65);color:#fff;padding:2px 6px;border-radius:4px}
.kind{position:absolute;right:8px;top:8px;font:700 12px var(--f-display);letter-spacing:.08em;background:var(--tally);color:#fff;padding:2px 7px;border-radius:4px}
.body{padding:12px 14px 14px;display:grid;gap:9px}
.file{font:500 12px var(--f-mono);color:var(--mute);overflow-wrap:anywhere}
label{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;font-size:13px}
label span{color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
select{font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0;width:100%}
select.changed{border-color:var(--tally);box-shadow:0 0 0 1px var(--tally)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:2px}
button{font:600 13px var(--f-body);padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
button.primary{background:var(--ok);border-color:var(--ok);color:#fff}
button:focus-visible,select:focus-visible{outline:2px solid var(--tally);outline-offset:2px}
.saved{font-size:12px;color:var(--ok)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>
<header>
  <div>
    <h1><span class="rec" aria-hidden="true"></span>Chấm cảnh</h1>
    <p class="meta"><span id="n">0</span> cảnh lấy mẫu từ bảng log. Mỗi ô đang để sẵn điều máy đoán. Đúng thì bấm “Máy đoán đúng”, sai ô nào thì chọn lại ô đó rồi bấm “Lưu”. Xong bấm “Tải answers.json” và đưa file đó cho Claude (hoặc chạy <code>calibrate.py fit</code>).</p>
  </div>
  <div class="prog"><span id="count">0/40</span><div class="bar"><i id="fill"></i></div></div>
  <div class="status" id="status"></div>
  <button id="dl" class="primary">Tải answers.json</button>
</header>
<main id="grid"></main>
<script>
const DATA = /*__DATA__*/[];
const OPTS = {
  rig: ["chân máy (tĩnh)","gimbal","slider/dolly","cầm tay","cầm tay (rung)","POV kính (đầu người)","điện thoại (chống rung/gimbal)","action cam"],
  move: ["tĩnh","pan sang trái","pan sang phải","tilt lên","tilt xuống","push in","pull out","zoom in","zoom out","truck ngang","bám theo (follow)","orbit","pedestal/crane","quay đầu (POV)","cúi/ngẩng (POV)","đi tới (POV)"],
  size: ["đặc tả (ECU)","cận (CU)","cận trung (MCU)","trung (MS)","toàn trung (MWS)","toàn (WS)","đại cảnh (EWS)","cảnh vật (không người)"],
  stability: ["ổn định","rung nhẹ","rung nặng","lia gắt"],
  sharp: ["nét","mờ / out nét","lệch nét","focus hunting","nhoè do chuyển động"]
};
const LABEL = {rig:"Đặt máy", move:"Chuyển động", size:"Cỡ cảnh", stability:"Ổn định", sharp:"Nét"};
const MACH = {rig:"rig", move:"move", size:"size", stability:"stab", sharp:"sharp"};
const docId = k => k.replace("#","__");
const answers = {};   // docId -> saved doc
let db = null;

function render(){
  const g = document.getElementById("grid"); g.textContent = "";
  DATA.forEach((it, i) => {
    const id = docId(it.k), saved = answers[id];
    const c = document.createElement("article"); c.className = "card" + (saved ? " done" : ""); c.id = "card-" + i;
    c.innerHTML = `<div class="shot"><img alt="4 khung của cảnh ${i+1}" loading="lazy" src="${it.src || ('img/' + it.img)}"><span class="tc"></span><span class="kind"></span></div><div class="body"><div class="file"></div></div>`;
    c.querySelector(".tc").textContent = "#" + (i+1) + " · " + it.t;
    c.querySelector(".kind").textContent = it.kind;
    c.querySelector(".file").textContent = it.path + "  " + it.k.split("#")[1];
    const body = c.querySelector(".body");
    for (const f of Object.keys(OPTS)){
      const lab = document.createElement("label"); const sp = document.createElement("span"); sp.textContent = LABEL[f];
      const sel = document.createElement("select"); sel.id = `s-${i}-${f}`; sel.dataset.f = f;
      const m = document.createElement("option"); m.value = ""; m.textContent = "Máy đoán: " + (it[MACH[f]] || "không rõ"); sel.appendChild(m);
      OPTS[f].forEach(o => { const op = document.createElement("option"); op.value = o; op.textContent = o; sel.appendChild(op); });
      if (saved && saved[f]) { sel.value = saved[f]; sel.classList.add("changed"); }
      sel.addEventListener("change", () => sel.classList.toggle("changed", !!sel.value));
      lab.append(sp, sel); body.appendChild(lab);
    }
    const row = document.createElement("div"); row.className = "row";
    const ok = document.createElement("button"); ok.className = "primary"; ok.textContent = "Máy đoán đúng";
    const sv = document.createElement("button"); sv.textContent = "Lưu";
    const st = document.createElement("span"); st.className = "saved"; st.textContent = saved ? "Đã chấm" : "";
    ok.onclick = () => { c.querySelectorAll("select").forEach(s => { s.value = ""; s.classList.remove("changed"); }); save(i, c, st); };
    sv.onclick = () => save(i, c, st);
    row.append(ok, sv, st); body.appendChild(row);
    g.appendChild(c);
  });
  progress();
}
function progress(){
  const n = DATA.filter(it => answers[docId(it.k)]).length;
  document.getElementById("count").textContent = n + "/" + DATA.length;
  document.getElementById("fill").style.width = (100*n/DATA.length) + "%";
}
const LS = "fl-calib-answers";
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ return {}; } }
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify(answers)); } catch(e){} }
async function save(i, card, st){
  const it = DATA[i]; const doc = {key: it.k, checked: true};
  card.querySelectorAll("select").forEach(s => { if (s.value) doc[s.dataset.f] = s.value; });
  answers[docId(it.k)] = doc; lsSave(); card.classList.add("done"); st.textContent = "Đã chấm"; progress();
  if (db){ try { await db.collection("answers").doc(docId(it.k)).set(doc); } catch(e){ st.textContent = "Đã chấm (chưa đồng bộ: " + (e && e.code || "lỗi") + ")"; } }
}
function download(){
  const out = {}; Object.values(answers).forEach(d => { const {key, checked, ...rest} = d; out[key] = rest; });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: "application/json"}));
  a.download = "answers.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
document.getElementById("dl").onclick = download;
document.getElementById("n").textContent = DATA.length;
Object.assign(answers, lsLoad());
render();
(async () => {
  const s = document.getElementById("status");
  try { if (window.claude && claude.use) db = await claude.use("db"); } catch(e) { db = null; }
  if (!db){ s.textContent = "Kết quả lưu trong trình duyệt này. Chấm xong bấm “Tải answers.json”."; return; }
  s.textContent = "Kết quả tự lưu (Artifact db) — Claude đọc lại được, hoặc bấm “Tải answers.json”.";
  db.collection("answers").onSnapshot(snap => {
    snap.docs.forEach(d => {
      if (!d.exists) return;
      answers[d.id] = d.data();
      const i = DATA.findIndex(it => docId(it.k) === d.id); if (i < 0) return;
      const c = document.getElementById("card-" + i); c.classList.add("done");
      c.querySelector(".saved").textContent = "Đã chấm";
      c.querySelectorAll("select").forEach(sel => { const v = d.data()[sel.dataset.f]; if (v && !sel.value) { sel.value = v; sel.classList.add("changed"); } });
    });
    progress();
  }, e => { s.textContent = "Không đọc được kết quả đã lưu (" + (e && e.code) + ")."; });
})();
</script>
</body></html>
