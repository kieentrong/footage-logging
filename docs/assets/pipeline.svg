<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5B7BA8"/></marker>
  </defs>
  <rect width="1200" height="430" rx="16" fill="#0B1726"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#FFFFFF">Ba tầng xem footage</text>
  <text x="40" y="80" font-size="15" fill="#8EA6C6">Máy làm phần đo đếm, AI local mô tả thô miễn phí, Claude chỉ xem kỹ những gì đáng xem.</text>
  <!-- input -->
  <g transform="translate(40 120)">
    <rect width="190" height="250" rx="12" fill="#101F33" stroke="#243A5A"/>
    <text x="20" y="36" font-size="13" font-weight="700" fill="#8EA6C6" letter-spacing="1">ĐẦU VÀO</text>
    <text x="20" y="72" font-size="16" fill="#E6EEF9">Folder dự án</text>
    <text x="20" y="104" font-size="14" fill="#9DB2CF">• Máy chính + proxy</text>
    <text x="20" y="130" font-size="14" fill="#9DB2CF">• Kính POV, điện thoại</text>
    <text x="20" y="156" font-size="14" fill="#9DB2CF">• Action cam</text>
    <text x="20" y="182" font-size="14" fill="#9DB2CF">• Mic rời (WAV)</text>
    <text x="20" y="222" font-size="12" fill="#5F7697">không đụng tới file gốc</text>
  </g>
  <!-- tier 1 -->
  <g transform="translate(270 120)">
    <rect width="250" height="250" rx="12" fill="#0F2442" stroke="#0061FF"/>
    <text x="20" y="36" font-size="13" font-weight="700" fill="#5EA0FF" letter-spacing="1">① MÁY ĐO</text>
    <text x="20" y="64" font-size="13" fill="#7F98BA">analyze.py · shots.py</text>
    <text x="20" y="98" font-size="14" fill="#DDE8F7">Chia cảnh, optical flow</text>
    <text x="20" y="122" font-size="14" fill="#DDE8F7">→ đặt máy, chuyển động</text>
    <text x="20" y="146" font-size="14" fill="#DDE8F7">Mặt + dáng → cỡ cảnh</text>
    <text x="20" y="170" font-size="14" fill="#DDE8F7">Nét, rung, phơi sáng, màu</text>
    <text x="20" y="194" font-size="14" fill="#DDE8F7">Âm thanh, mic rời, take</text>
    <text x="20" y="228" font-size="12" fill="#5F7697">macOS · Linux · WSL</text>
  </g>
  <!-- tier 2 -->
  <g transform="translate(560 120)">
    <rect width="250" height="250" rx="12" fill="#0E2A3A" stroke="#2BB8C9"/>
    <text x="20" y="36" font-size="13" font-weight="700" fill="#60EFFF" letter-spacing="1">② AI LOCAL</text>
    <text x="20" y="64" font-size="13" fill="#7F98BA">mac_local.sh (tuỳ chọn)</text>
    <text x="20" y="98" font-size="14" fill="#DDE8F7">mlx-whisper large-v3-turbo</text>
    <text x="20" y="122" font-size="14" fill="#DDE8F7">→ bóc băng chuẩn tiếng Việt</text>
    <text x="20" y="146" font-size="14" fill="#DDE8F7">Qwen2.5-VL nhìn từng cảnh</text>
    <text x="20" y="170" font-size="14" fill="#DDE8F7">→ mô tả thô, rủi ro, điểm</text>
    <text x="20" y="228" font-size="12" fill="#5F7697">Mac Apple Silicon · miễn phí</text>
  </g>
  <!-- tier 3 -->
  <g transform="translate(850 120)">
    <rect width="310" height="250" rx="12" fill="#1A1F3D" stroke="#8C7CFF"/>
    <text x="20" y="36" font-size="13" font-weight="700" fill="#B3A8FF" letter-spacing="1">③ CLAUDE XEM 2 LƯỢT</text>
    <text x="20" y="64" font-size="13" fill="#7F98BA">review.py pages · strip · log</text>
    <text x="20" y="98" font-size="14" fill="#DDE8F7">Lượt 1: contact sheet + lời thoại</text>
    <text x="20" y="122" font-size="14" fill="#DDE8F7">Lượt 2: dải khung 0.4s, chốt in/out</text>
    <text x="20" y="146" font-size="14" fill="#DDE8F7">Sửa chỗ máy đoán sai, bắt rủi ro</text>
    <rect x="20" y="170" width="270" height="44" rx="8" fill="#0061FF"/>
    <text x="155" y="198" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">clip_log.html · .csv · .json</text>
    <text x="20" y="236" font-size="12" fill="#5F7697">mỗi dòng một CẢNH · 49 cột</text>
  </g>
  <path d="M232 245 H266" stroke="#5B7BA8" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M522 245 H556" stroke="#5B7BA8" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M812 245 H846" stroke="#5B7BA8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1160" y="404" font-size="12" fill="#5F7697" text-anchor="end">Ưu tiên khi gộp: Claude &gt; AI local &gt; máy đo</text>
</svg>
